name: Build Android APK & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed APK (Yemen Mobile Balance)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK (API 36.1)
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install SDK 36.1
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || sdkmanager "platforms;android-36" "build-tools;35.0.0" || true

      - name: Setup Gradle 9.3.1 (Matching AGP 9.1.1)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Signing Keystores (Debug & Release)
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkey -v -keystore my-upload-key.jks \
              -storepass android123 -alias upload \
              -keypass android123 -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Yemen Mobile Balance,O=YemenTelecom,C=YE"
          fi
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Build Signed Debug & Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android123' }}
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Output Directory
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/release/*.apk release-apks/yemen-mobile-balance-release.apk
          cp app/build/outputs/apk/debug/*.apk release-apks/yemen-mobile-balance-debug.apk
          ls -lh release-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yemen-mobile-balance-apks
          path: release-apks/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "رصيد يمن موبايل والشبكات اليمنية (v2.0.${{ github.run_number }})"
          body: |
            ### تطبيق رصيد يمن موبايل والشبكات اليمنية 📱🇾🇪
            - **`yemen-mobile-balance-release.apk`**: النسخة النهائية الموقعة والجاهزة للتثبيت المباشر على الهاتف.
            - **`yemen-mobile-balance-debug.apk`**: نسخة التجربة والفحص.
          files: release-apks/*.apk
